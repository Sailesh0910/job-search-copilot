<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Job Copilot{% endblock %}</title>
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>
    <header class="topbar">
        <a class="brand" href="/">Job Copilot</a>
        <nav>
            <a href="/jobs" class="{{ 'active' if request.url.path == '/jobs' }}">Browse</a>
            <a href="/recommended" class="{{ 'active' if request.url.path == '/recommended' }}">Recommended</a>
            <a href="/pipeline" class="{{ 'active' if request.url.path == '/pipeline' }}">Pipeline</a>
            <a href="/profile" class="{{ 'active' if request.url.path == '/profile' }}">Profile</a>
        </nav>
    </header>
    <main>
        {% block content %}{% endblock %}
    </main>
</body>
</html>
